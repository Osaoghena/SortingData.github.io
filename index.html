<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Book Shelf</title>

  <style>
      body {
          font-family: Arial, sans-serif;
          background-color: #b8e6ad;
          color: #2c3c28;
          max-width: 800px;
          margin: 40px auto;
          padding: 20px;
      }

      h1 {
          text-align: center;
      }

      .buttons {
          text-align: center;
          margin-bottom: 20px;
      }

      button {
          padding: 10px;
          margin: 5px;
          cursor: pointer;
      }

      select {
          padding: 8px;
          margin-left: 5px;
      }

      #count {
          font-weight: bold;
          margin-top: 20px;
      }

      .book {
          background-color: #d7ead2;
          padding: 15px;
          margin: 10px 0;
          border-radius: 8px;
          box-shadow: 0 2px 5px #ccc;
      }

      .book h2 {
          margin: 0 0 5px;
      }
  </style>
</head>

<body>

<h1>My Book Shelf</h1>

<div class="buttons">
  <button onclick="sortByTitle()">Sort by Title</button>
  <button onclick="sortByPages()">Sort by Pages</button>
  <button onclick="sortByYear()">Sort by Year</button>
</div>

<label for="genre">Filter by Genre:</label>

<select id="genre" onchange="filterBooks()">
  <option value="All">All</option>
  <option value="Dark Fantasy">Dark Fantasy</option>
  <option value="Autobiography">Autobiography</option>
  <option value="Science Fiction">Science Fiction</option>
  <option value="Young Adult">Young Adult</option>
  <option value="Mystery">Mystery</option>
</select>

<p id="count"></p>

<div id="book-list"></div>

<script>
  // Book data
  const books = [
    {
      title: "The Darkest Minds",
      author: "Alexandra Bracken",
      pages: 496,
      year: 2012,
      genre: "Young Adult"
    },
    {
      title: "Smile",
      author: "Raina Telgemeier",
      pages: 224,
      year: 2010,
      genre: "Autobiography"
    },
    {
      title: "The Hate U Give",
      author: "Angie Thomas",
      pages: 444,
      year: 2017,
      genre: "Young Adult"
    },
    {
      title: "The Hunger Games",
      author: "Suzanne Collins",
      pages: 374,
      year: 2008,
      genre: "Science Fiction"
    },
    {
      title: "Dune",
      author: "Frank Herbert",
      pages: 540,
      year: 1965,
      genre: "Science Fiction"
    },
    {
      title: "They Both Die at the End",
      author: "Adam Silvera",
      pages: 384,
      year: 2017,
      genre: "Young Adult"
    },
    {
      title: "Coraline",
      author: "Neil Gaiman",
      pages: 208,
      year: 2002,
      genre: "Dark Fantasy"
    },
    {
      title: "Gone Girl",
      author: "Gillian Flynn",
      pages: 422,
      year: 2012,
      genre: "Mystery"
    }
  ];

  // Render books using map()
  function render(booksToRender) {

    document.getElementById("book-list").innerHTML =
      booksToRender.map(book => `
          <div class="book">
            <h2>${book.title}</h2>
            <p>Author: ${book.author}</p>
            <p>Pages: ${book.pages}</p>
            <p>Year: ${book.year}</p>
            <p>Genre: ${book.genre}</p>
          </div>
        `).join("");

    // Show how many books are displayed
    document.getElementById("count").textContent =
      `Showing ${booksToRender.length} of ${books.length} books`;
  }

  // Sort by title
  function sortByTitle() {
    const sortedBooks = [...books].sort((a, b) =>
      a.title.localeCompare(b.title)
    );

    render(sortedBooks);
  }

  // Sort by pages
  function sortByPages() {
    const sortedBooks = [...books].sort((a, b) =>
      a.pages - b.pages
    );

    render(sortedBooks);
  }

  // Sort by year
  function sortByYear() {
    const sortedBooks = [...books].sort((a, b) =>
      a.year - b.year
    );

    render(sortedBooks);
  }

  // Filter by genre
  // This also chains filter() and sort()
  function filterBooks() {
    const selectedGenre = document.getElementById("genre").value;

    const filteredBooks = books
      .filter(book =>
        selectedGenre === "All" || book.genre === selectedGenre
      )
      .sort((a, b) =>
        a.title.localeCompare(b.title)
      );

    render(filteredBooks);
  }

  // Display all books when the page loads
  render(books);
</script>

</body>
</html>
